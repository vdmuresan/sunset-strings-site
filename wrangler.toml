# Offline Cloudflare config for the Sunset Strings static copy.
# Do not deploy this file until the sanctioned Cloudflare connector is authenticated.
# This repository does not call the Cloudflare API, Wrangler deploy, or any hosting account.

name = "sunset-strings-site"
compatibility_date = "2026-11-08"
main = "worker/index.js"

[assets]
directory = "./site"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = true

# Pages alternative (same output directory; functions/ applies the same routes):
# pages_build_output_dir = "site"
